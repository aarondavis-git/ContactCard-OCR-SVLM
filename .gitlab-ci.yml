image: python:3.12-slim

stages:
  - check

variables:
  UV_CACHE_DIR: .uv-cache

cache:
  paths:
    - .uv-cache/

before_script:
  - pip install uv
  - apt-get update -qq && apt-get install -y -qq tesseract-ocr poppler-utils
  - uv sync

lint:
  stage: check
  script:
    - uv run ruff check .

typecheck:
  stage: check
  script:
    - uv run mypy src/

test:
  stage: check
  script:
    - uv run pytest
